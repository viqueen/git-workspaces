version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before opening PRs so compromised releases can be yanked first.
    cooldown:
      semver-minor-days: 3
      semver-patch-days: 3
      # Hold major upgrades back so they land roughly once a month.
      semver-major-days: 30
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk updates into a single PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      semver-minor-days: 3
      semver-patch-days: 3
      semver-major-days: 30
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
